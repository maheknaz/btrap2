<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 4 Cards</title>
  <!-- Bootstrap 4 CSS CDN -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

  <div class="container mt-5">
    <div class="row">
      <div class="col-md-12">

        <!-- Basic Card with Content -->
        <div class="card mb-4">
          <div class="card-body">
            <p class="card-text">This is a basic Bootstrap 4 card with only body content.</p>
          </div>
        </div>

        
        <div class="card mb-4">
          <div class="card-header">
            Card Header
          </div>
          <div class="card-body">
            <p class="card-text">This card has a header and a footer.</p>
          </div>
          <div class="card-footer">
            Card Footer
          </div>
        </div>

        
        <div class="card mb-4">
          <div class="card-header">
            Featured Card
          </div>
          <img src="https://as2.ftcdn.net/v2/jpg/05/11/55/91/1000_F_511559113_UTxNAE1EP40z1qZ8hIzGNrB0LwqwjruK.jpg"
          <div class="card-body">
            <h5 class="card-title">Card Title</h5>
            <p class="card-text">This is a more complete card example with image, title, content, and footer.</p>
          </div>
          <div class="card-footer text-muted">
            Last updated 3 mins ago
          </div>
        </div>

      </div>
    </div>
  </div>

  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
